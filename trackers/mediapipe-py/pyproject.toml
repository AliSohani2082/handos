[project]
name = "handos-tracker-mp"
version = "0.1.0"
description = "MediaPipe webcam tracker for handOs"
requires-python = ">=3.12"
dependencies = ["mediapipe>=1.2.3", "opencv-contrib-python~=5.0.0", "numpy>=2.0"]

[project.scripts]
handos-tracker-mp = "handos_tracker_mp.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
